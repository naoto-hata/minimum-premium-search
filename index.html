.company{font-size:14px;color:#334155;font-weight:900;margin-top:4px}
.category{font-size:13px;color:#64748b;margin-top:6px;line-height:1.45}
.premium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

<header>

</header>

<section class="panel">

  </div>
  <input id="search" style="margin-top:9px" placeholder="商品名・保険会社・キーワードで検索">
  <div class="actions">
    <button class="primary" onclick="render()">検索</button>
    <button class="ghost" onclick="resetFilters()">リセット</button>
  </div>
</section>

<div class="summary">
  <div class="stat"><div class="num" id="countAll">0</div><div class="label">表示件数</div></div>
  <div class="stat"><div class="num" id="countCompanies">0</div><div class="label">会社数</div></div>
  <div class="stat"><div class="num" id="countNotes">0</div><div class="label">注意あり</div></div>
</div>

<div class="current" id="current"></div>
<main class="list" id="list"></main>
<div class="footer">研修資料・社内限・顧客提示禁止。内容は元資料時点の情報です。</div>

function norm(s){return String(s??"").toLowerCase().replace(/\s+/g,"").replace(/[　]/g,"")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uniq(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"ja"))}
function opt(v,l){return `<option value="${esc(v)}">${esc(l)}</option>`}

function populate(){
  category.innerHTML = opt("all","大分類：すべて") + uniq(DATA.map(r=>r.大分類)).map(v=>opt(v,v)).join("");
  company.innerHTML = opt("all","保険会社：すべて") + uniq(DATA.map(r=>r.保険会社)).map(v=>opt(v,v)).join("");
}

function updateCompanies(){
  const c = category.value;
  const prev = company.value;
  const base = DATA.filter(r => c==="all" || r.大分類===c);
  const companies = uniq(base.map(r=>r.保険会社));
  company.innerHTML = opt("all","保険会社：すべて") + companies.map(v=>opt(v,v)).join("");
  if(companies.includes(prev)) company.value = prev;
}

function hasPay(row, p){
  if(p==="all") return true;
  return !!row[p] && row[p] !== "-" && row[p] !== "‐" && row[p] !== "制限なし";
}

function filtered(){
  const c = category.value, co = company.value, p = pay.value, q = norm(search.value);
  return DATA.filter(r => {
    if(c !== "all" && r.大分類 !== c) return false;
    if(co !== "all" && r.保険会社 !== co) return false;
    if(!hasPay(r,p)) return false;
    if(!q) return true;
    return norm(Object.values(r).join(" ")).includes(q);
  });
}

function highlight(text){
  const q = String(search.value||"").trim();
  const safe = esc(text);
  if(!q) return safe;
  const parts = q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!parts.length) return safe;
  try{return safe.replace(new RegExp("("+parts.join("|")+")","gi"),"<mark>$1</mark>")}catch(e){return safe}
}

function pbox(label,val){return `<div class="pbox"><div class="pLabel">${label}</div><div class="pVal">${esc(val || "—")}</div></div>`}

function render(){
  const rows = filtered();
  countAll.textContent = rows.length;
  countCompanies.textContent = new Set(rows.map(r=>r.保険会社)).size;
  countNotes.textContent = rows.filter(r=>r.注意事項 || r.制限品目).length;
  current.textContent = `現在の条件：${category.value==="all"?"大分類すべて":category.value} / ${company.value==="all"?"保険会社すべて":company.value} / ${pay.selectedOptions[0].textContent}`;

  if(!rows.length){list.innerHTML = `<div class="empty">該当する項目がありません</div>`; return;}
  list.innerHTML = rows.map(r => `<article class="card">
    <div class="product">${highlight(r.商品名)}</div>
    <div class="company">${highlight(r.保険会社)}</div>
    <div class="category">${esc(r.大分類)}</div>
    <div class="premium">${pbox("月払",r.月払)}${pbox("半年払",r.半年払)}${pbox("年払",r.年払)}</div>
    ${r.注意事項 ? `<div class="note">注意：${esc(r.注意事項)}</div>` : ""}
    ${r.制限品目 ? `<div class="restrict">制限・対象外：${esc(r.制限品目)}</div>` : ""}
  </article>`).join("");
}

function resetFilters(){
  category.value = "all";
  updateCompanies();
  company.value = "all";
  pay.value = "all";
  search.value = "";
  render();
}

category.addEventListener("change",()=>{updateCompanies(); render();});
